<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ideaForge Bot Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .container {
      background: #12122a;
      border: 1px solid #2a2a5a;
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #8A2BE2;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ccc;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: #1a1a3e;
      border: 1px solid #3a3a6a;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.3s;
    }
    .form-group input:focus {
      border-color: #8A2BE2;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8A2BE2, #6a1fb0);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(138, 43, 226, 0.4);
    }
    .btn:disabled {
      background: #444;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.success { background: #1a3a1a; color: #4ade80; display: block; }
    .status.error { background: #3a1a1a; color: #f87171; display: block; }
    .status.info { background: #1a2a3a; color: #60a5fa; display: block; }
    
    .discord-link {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #5865F2;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    .discord-link:hover { color: #4752c4; text-decoration: underline; }
    
    .warning {
      background: #3a2a1a;
      color: #fbbf24;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 20px;
      text-align: left;
    }

    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    #dashboardScreen {
      display: none;
    }
    
    .lock-icon {
      font-size: 48px;
      margin-bottom: 20px;
      color: #8A2BE2;
    }

    .logout-btn {
      margin-top: 20px;
      background: #dc2626;
      font-size: 14px;
      padding: 10px;
    }
    .logout-btn:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="container" id="loginScreen">
    <div class="lock-icon">🔐</div>
    <div class="logo">⚡ ideaForge</div>
    <div class="subtitle">Įvesk prieigos kodą norėdamas tęsti</div>

    <div class="form-group">
      <label for="accessCode">Prieigos kodas</label>
      <input type="password" id="accessCode" placeholder="Įvesk kodą..." onkeypress="handleKeyPress(event)">
    </div>

    <button class="btn" onclick="verifyCode()">🔓 Prisijungti</button>
    
    <div class="status" id="loginStatus"></div>
  </div>

  <div class="container" id="dashboardScreen">
    <div class="logo">⚡ ideaForge</div>
    <div class="subtitle">Discord Boto Valdymo Skydelis</div>

    <div class="warning">
      ⚠️ <strong>Saugumo įspėjimas:</strong> Niekada niekam neduok savo boto tokeno.
    </div>

    <div class="form-group">
      <label for="token">Discord Bot Token</label>
      <input type="password" id="token" placeholder="Įklijuok savo botų tokeną čia...">
    </div>

    <button class="btn" id="loginBtn" onclick="loginBot()"> Prisijungti prie Discord</button>
    
    <div class="status" id="status"></div>

    <a href="https://discord.gg/3uQTZz6BP" target="_blank" class="discord-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      Prisijungti prie Discord serverio
    </a>

    <button class="btn logout-btn" onclick="logout()">🚪 Atsijungti</button>
  </div>

  <script>
    const ACCESS_CODE = 'LoginasDokumentaigg';

    window.onload = function() {
      if (sessionStorage.getItem('isLoggedIn') === 'true') {
        showDashboard();
        checkBotStatus();
      }
    };

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        verifyCode();
      }
    }

    function verifyCode() {
      const codeInput = document.getElementById('accessCode');
      const statusDiv = document.getElementById('loginStatus');
      const enteredCode = codeInput.value.trim();

      if (enteredCode === ACCESS_CODE) {
        sessionStorage.setItem('isLoggedIn', 'true');
        showDashboard();
        codeInput.value = '';
        statusDiv.className = 'status success';
        statusDiv.textContent = '✅ Sėkmingai prisijungta!';
        setTimeout(() => {
          statusDiv.style.display = 'none';
        }, 2000);
      } else {
        statusDiv.className = 'status error';
        statusDiv.textContent = '❌ Neteisingas prieigos kodas!';
        codeInput.value = '';
        codeInput.focus();
      }
    }

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboardScreen').style.display = 'block';
    }

    function logout() {
      sessionStorage.removeItem('isLoggedIn');
      location.reload();
    }

    async function checkBotStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('loginBtn');

        if (data.status === 'online') {
          statusDiv.className = 'status success';
          statusDiv.innerHTML = `✅ Botas prisijungęs kaip: <strong>${data.user}</strong>`;
          btn.textContent = '🔄 Perkrauti botą';
          document.getElementById('token').value = '';
        } else {
          statusDiv.className = 'status info';
          statusDiv.textContent = 'ℹ️ Botas šiuo metu atjungtas. Įvesk tokeną ir paspausk „Prisijungti".';
        }
      } catch (err) {
        console.error('Klaida tikrinant būseną:', err);
      }
    }

    async function loginBot() {
      const token = document.getElementById('token').value.trim();
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('loginBtn');

      if (!token) {
        statusDiv.className = 'status error';
        statusDiv.textContent = '❌ Prašome įvesti tokeną!';
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ Jungiamasi...';
      statusDiv.className = 'status info';
      statusDiv.textContent = 'ℹ️ Bandoma prisijungti prie Discord...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });

        const data = await res.json();

        if (data.success) {
          statusDiv.className = 'status success';
          statusDiv.innerHTML = `✅ ${data.message}`;
          btn.textContent = '🔄 Perkrauti botą';
          document.getElementById('token').value = '';
        } else {
          statusDiv.className = 'status error';
          statusDiv.textContent = `❌ ${data.error}`;
        }
      } catch (err) {
        statusDiv.className = 'status error';
        statusDiv.textContent = '❌ Nepavyko susisiekti su serveriu.';
      } finally {
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
