<!DOCTYPE html>
<html lang="lt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ideaForge — Failų Saugykla · Coding Zone · Security</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%234D7DFE' d='M12 2l9 5-9 5-9-5z'/><path fill='%238B5CF6' d='M3 12l9 5 9-5M3 17l9 5 9-5'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ KINTAMIEJI / TEMOS ============ */
:root{
--bg:#05070f; --bg2:#0a1024; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.08);
--line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
--txt:#eaeffc; --mut:#98a2c0; --mut2:#6b7595;
--blue:#4d7dfe; --violet:#8b5cf6; --cyan:#38bdf8; --pink:#ec4899;
--ok:#34d399; --warn:#fbbf24; --err:#f87171;
--grad:linear-gradient(135deg,#4d7dfe 0%,#8b5cf6 100%);
--grad2:linear-gradient(135deg,#38bdf8 0%,#4d7dfe 100%);
--grad3:linear-gradient(135deg,#f472b6 0%,#8b5cf6 100%);
--grad4:linear-gradient(135deg,#34d399 0%,#38bdf8 100%);
--glow:0 10px 40px -8px rgba(99,102,241,.55);
--glass:blur(18px) saturate(150%);
--r:16px; --r2:22px;
--sh:0 20px 60px -20px rgba(0,0,0,.6);
--mono:'JetBrains Mono',monospace;
}
html[data-theme="light"]{
--bg:#edf1fa; --bg2:#e3e9f7; --panel:rgba(255,255,255,.72); --panel2:rgba(255,255,255,.92);
--line:rgba(16,23,49,.10); --line2:rgba(16,23,49,.2);
--txt:#101731; --mut:#59628a; --mut2:#8a92b2;
--glow:0 10px 34px -10px rgba(99,102,241,.4);
--sh:0 18px 50px -22px rgba(30,40,90,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;line-height:1.6;transition:background .4s,color .4s}
::selection{background:rgba(139,92,246,.45)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--blue),var(--violet));border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.h1,.h2,.disp{font-family:'Unbounded',sans-serif;line-height:1.12;letter-spacing:-.01em}
.grad-tx{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ic{flex:none;vertical-align:-3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
/* ============ FONO EFEKTAI ============ */
#bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
radial-gradient(900px 600px at 12% -5%,rgba(77,125,254,.20),transparent 60%),
radial-gradient(800px 600px at 95% 10%,rgba(139,92,246,.18),transparent 60%),
radial-gradient(700px 700px at 60% 110%,rgba(56,189,248,.10),transparent 60%),var(--bg)}
.gridfx{position:absolute;inset:-60%;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.35;animation:gridPan 70s linear infinite;mask-image:radial-gradient(70% 60% at 50% 40%,#000 30%,transparent 75%)}
@keyframes gridPan{to{transform:translate(56px,56px)}}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:orbFloat 16s ease-in-out infinite}
.o1{width:380px;height:380px;background:rgba(77,125,254,.35);top:-80px;left:-80px}
.o2{width:420px;height:420px;background:rgba(139,92,246,.30);top:30%;right:-140px;animation-delay:-6s}
.o3{width:300px;height:300px;background:rgba(56,189,248,.22);bottom:-100px;left:30%;animation-delay:-11s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.12)}}
/* ============ PALEIDIMO EKRANAS ============ */
#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#boot.done{opacity:0;visibility:hidden}
#boot .blogo{animation:bootPulse 1.2s ease-in-out infinite}
@keyframes bootPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 12px rgba(139,92,246,.6))}50%{transform:scale(1.12);filter:drop-shadow(0 0 26px rgba(77,125,254,.9))}}
.bootbar{width:210px;height:4px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bootbar i{display:block;height:100%;width:40%;border-radius:4px;background:var(--grad);animation:bootSlide 1.1s ease-in-out infinite}
@keyframes bootSlide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
#boot small{color:var(--mut);letter-spacing:.28em;font-size:10px;font-weight:700}
/* ============ NAVIGACIJA ============ */
#siteNav{position:fixed;top:0;left:0;right:0;z-index:90;transition:.35s}
#siteNav .nbar{display:flex;align-items:center;gap:26px;padding:16px 24px;max-width:1280px;margin:0 auto}
#siteNav.scrolled{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:var(--glass);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Unbounded';font-weight:700;font-size:17px;text-decoration:none}
.brand .bmark{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:var(--glow);overflow:hidden}
.brand .bmark img{width:100%;height:100%;object-fit:cover}
.brand em{font-style:normal;color:var(--mut);font-weight:600}
.nlinks{display:flex;gap:4px;margin-left:12px}
.nlinks a{text-decoration:none;color:var(--mut);font-weight:600;font-size:14px;padding:8px 13px;border-radius:10px;transition:.25s}
.nlinks a:hover{color:var(--txt);background:var(--panel)}
.nright{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mut);white-space:nowrap}
.pill.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);display:grid;place-items:center;transition:.25s;position:relative}
.iconbtn:hover{border-color:var(--line2);transform:translateY(-2px);background:var(--panel2)}
.burger{display:none}
body.in-app #siteNav{display:none}
/* ============ MYGTUKAI / FORMOS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:13px;border:1px solid transparent;font-weight:800;font-size:14.5px;padding:12px 22px;transition:.28s;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.btn.primary:hover{transform:translateY(-3px);box-shadow:0 16px 44px -8px rgba(139,92,246,.7)}
.btn.ghost{border-color:var(--line2);background:var(--panel);color:var(--txt);backdrop-filter:blur(8px)}
.btn.ghost:hover{transform:translateY(-3px);border-color:var(--blue);background:var(--panel2)}
.btn.danger{background:rgba(248,113,113,.14);color:var(--err);border-color:rgba(248,113,113,.35)}
.btn.danger:hover{background:rgba(248,113,113,.25)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn.lg{padding:15px 30px;font-size:15.5px;border-radius:15px}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:7px}
.inp{width:100%;padding:13px 15px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:14.5px;font-weight:600;outline:none;transition:.25s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(77,125,254,.16)}
textarea.inp{resize:vertical;min-height:90px}
.ferr{color:var(--err);font-size:12.5px;font-weight:700;margin-top:6px;min-height:16px}
.strength{height:5px;border-radius:5px;background:var(--panel2);margin-top:8px;overflow:hidden}
.strength i{display:block;height:100%;width:0;border-radius:5px;transition:.4s;background:var(--err)}
.botchk{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--panel);cursor:pointer;user-select:none;margin-bottom:15px;transition:.25s}
.botchk:hover{border-color:var(--line2)}
.botchk .bx{width:24px;height:24px;border-radius:7px;border:2px solid var(--mut2);display:grid;place-items:center;color:transparent;transition:.3s;flex:none}
.botchk.on .bx{background:var(--grad);border-color:transparent;color:#fff;animation:popIn .35s}
.botchk.on{border-color:rgba(52,211,153,.5)}
.botchk small{color:var(--mut);font-weight:600}
@keyframes popIn{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
/* ============ APP KEVALAS ============ */
.app{display:flex;min-height:100vh}
.side{width:260px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;border-right:1px solid var(--line);background:var(--panel);backdrop-filter:var(--glass);z-index:60;overflow-y:auto}
.side::-webkit-scrollbar{width:6px}
.side .brand{margin-bottom:22px;padding:0 8px}
.snav{display:flex;flex-direction:column;gap:3px}
.snav .slabel{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--mut2);padding:14px 14px 6px;text-transform:uppercase}
.snav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-radius:12px;background:transparent;color:var(--mut);font-weight:800;font-size:13.5px;transition:.25s;text-align:left}
.snav button:hover{background:var(--panel2);color:var(--txt)}
.snav button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.snav .sb-badge{margin-left:auto;background:rgba(248,113,113,.9);color:#fff;font-size:10.5px;border-radius:99px;padding:2px 8px;font-weight:800}
.side .sfoot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:12px}
.sstore{padding:13px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}
.sstore b{font-size:12px;display:flex;justify-content:space-between;margin-bottom:9px}
.sstore small{color:var(--mut2);font-size:11px;font-weight:700}
.suser{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-family:'Unbounded';font-size:14px;flex:none}
.suser b{font-size:13px;display:block;line-height:1.25}
.suser small{color:var(--mut);font-size:11px;font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:var(--glass)}
.topbar h1{font-family:'Unbounded';font-size:18px;font-weight:700}
.topbar .tspacer{flex:1}
.bellwrap,.avawrap{position:relative}
.badge-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:99px;background:var(--grad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:var(--glow)}
.drop{position:absolute;right:0;top:calc(100% + 12px);width:330px;border:1px solid var(--line2);border-radius:18px;background:var(--panel2);backdrop-filter:var(--glass);box-shadow:var(--sh);z-index:80;animation:dropIn .3s cubic-bezier(.2,.9,.3,1.2);overflow:hidden}
@keyframes dropIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
.drop .dhead{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:13.5px}
.drop .dhead i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:ping 1.8s infinite}
.dlist{max-height:340px;overflow:auto}
.ditem{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);transition:.2s}
.ditem:hover{background:var(--panel)}
.ditem .dic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff}
.ditem b{font-size:13px;display:block;line-height:1.35}
.ditem p{font-size:12px;color:var(--mut);font-weight:600}
.ditem small{color:var(--mut2);font-size:11px;font-weight:700}
.view{padding:30px 28px 60px;animation:viewIn .45s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ============ BENDRI KOMPONENTAI ============ */
.greet{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.greet h2{font-family:'Unbounded';font-size:clamp(20px,2.6vw,27px);font-weight:700}
.greet p{color:var(--mut);font-size:13.5px;font-weight:600}
.greet .gacts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.pin-banner{display:flex;gap:14px;align-items:flex-start;padding:17px 20px;border-radius:var(--r);border:1px solid rgba(251,191,36,.4);background:linear-gradient(120deg,rgba(251,191,36,.12),rgba(139,92,246,.10));margin-bottom:24px;animation:viewIn .5s}
.pin-banner .pico{width:40px;height:40px;border-radius:12px;background:rgba(251,191,36,.2);color:var(--warn);display:grid;place-items:center;flex:none}
.pin-banner b{font-size:14.5px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.pin-banner p{color:var(--mut);font-size:13.3px;margin-top:3px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.12em;padding:3px 9px;border-radius:99px;background:rgba(251,191,36,.22);color:var(--warn)}
.tag.blue{background:rgba(77,125,254,.2);color:var(--blue)}
.tag.green{background:rgba(52,211,153,.18);color:var(--ok)}
.tag.red{background:rgba(248,113,113,.18);color:var(--err)}
.tag.violet{background:rgba(139,92,246,.2);color:var(--violet)}
.tag.cyan{background:rgba(56,189,248,.18);color:var(--cyan)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);backdrop-filter:var(--glass);padding:20px;transition:.3s;position:relative;overflow:hidden}
.stat:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:var(--sh)}
.stat .sic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;margin-bottom:13px}
.stat b{font-family:'Unbounded';font-size:23px;display:block}
.stat span{color:var(--mut);font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.panel{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);backdrop-filter:var(--glass);overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line);font-family:'Unbounded';font-size:13.5px;font-weight:600}
.phead .ph-ic{color:var(--blue)}
.phead .ph-more{margin-left:auto;color:var(--mut);font-size:12px;font-weight:700;background:none;border:0}
.phead .ph-more:hover{color:var(--blue)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.kv:last-child{border-bottom:0}
.kv span{color:var(--mut)}
.kv b{text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.empty .eico{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut2)}
.empty b{display:block;color:var(--txt);font-size:14.5px;margin-bottom:4px}
.empty p{font-size:12.8px}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .25s;background:var(--grad)}
.mini-act{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--mut);display:grid;place-items:center;transition:.2s}
.mini-act:hover{color:var(--txt);border-color:var(--line2);transform:translateY(-2px)}
.recent-row{display:flex;align-items:center;gap:13px;padding:13px 20px;border-bottom:1px solid var(--line);transition:.2s}
.recent-row:last-child{border-bottom:0}
.recent-row:hover{background:var(--panel2)}
.ft-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.recent-row b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.recent-row small{color:var(--mut);font-size:11.8px;font-weight:700}
.recent-row .ract{margin-left:auto;display:flex;gap:6px}
.dashgrid{display:grid;grid-template-columns:1.65fr 1fr;gap:18px;align-items:start}
.news-item{padding:17px 20px;border-bottom:1px solid var(--line);transition:.25s}
.news-item:last-child{border-bottom:0}
.news-item:hover{background:var(--panel2)}
.news-item b{font-size:14.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.news-item p{color:var(--mut);font-size:13.4px;margin-top:5px}
.news-item small{color:var(--mut2);font-size:11.5px;font-weight:700;display:block;margin-top:7px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:20px;width:fit-content}
.subtabs button{padding:9px 16px;border:0;border-radius:10px;background:transparent;color:var(--mut);font-weight:800;font-size:13px;transition:.25s;display:flex;gap:7px;align-items:center}
.subtabs button.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
/* ============ KONTAKT KORTELIŲ STILIUS ============ */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.contact-card{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);backdrop-filter:var(--glass);padding:24px;transition:.3s;position:relative;overflow:hidden}
.contact-card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:var(--sh)}
.contact-card .cc-ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;margin-bottom:16px;font-size:24px}
.contact-card h3{font-family:'Unbounded';font-size:15px;margin-bottom:8px}
.contact-card p{color:var(--mut);font-size:13.5px;margin-bottom:16px}
.contact-card .cc-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:11px;background:var(--grad);color:#fff;font-weight:700;font-size:13px;text-decoration:none;transition:.25s}
.contact-card .cc-btn:hover{transform:translateY(-2px);box-shadow:var(--glow)}
/* ============ SAVININKO PROFILIS ============ */
.owner-profile{display:grid;grid-template-columns:300px 1fr;gap:24px;margin-bottom:24px}
.owner-photo{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);backdrop-filter:var(--glass);padding:24px;text-align:center}
.owner-photo img{width:100%;max-width:250px;border-radius:16px;margin-bottom:16px;box-shadow:var(--sh)}
.owner-photo h3{font-family:'Unbounded';font-size:18px;margin-bottom:6px}
.owner-photo .owner-role{color:var(--blue);font-size:13px;font-weight:700;margin-bottom:16px}
.owner-info{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);backdrop-filter:var(--glass);padding:28px}
.owner-info h2{font-family:'Unbounded';font-size:22px;margin-bottom:16px}
.owner-info p{color:var(--mut);font-size:14px;line-height:1.7;margin-bottom:16px}
.owner-info .owner-contacts{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.owner-info .owner-contact-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);transition:.2s}
.owner-info .owner-contact-item:hover{border-color:var(--blue);transform:translateX(4px)}
.owner-info .owner-contact-item .oc-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.owner-info .owner-contact-item b{font-size:13px;display:block}
.owner-info .owner-contact-item small{color:var(--mut);font-size:11.5px;font-weight:700}

/* ============ CODING ZONE ============ */

/* ============ SECURITY CHECK ============ */
.sc-upload{border:2px dashed var(--line2);border-radius:var(--r2);padding:50px 30px;text-align:center;transition:.3s;cursor:pointer;background:var(--panel)}

.cs-bk small{color:var(--mut);font-size:11.5px;font-weight:700}

function simulatePython(code){
if(!code.trim())return'# Paleiskite kodą — rezultatas atsiras čia';
const prints=[];
code.split('\n').forEach(line=>{
const m=line.match(/^\s*print\s*\((.+)\)\s*$/);
if(m){try{const expr=m[1].replace(/(["'])(.*?)\1/g,'"$2"').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/\bNone\b/g,'null');prints.push(String(eval(expr)))}catch(e){prints.push('<error: '+e.message+'>')}}
});
return prints.length?prints.join('\n'):'# Kodas paleistas (print() komandų nerasta)\n# Simuliacija apdoroja tik print() eilutes';
}

function runSecurityCheck(file){
const u=me();
openModal(`<h3>Analizuojama...</h3><p class="msub">${esc(file.name)} · ${fmtSize(file.size)}</p>
<div style="text-align:center;padding:30px 0"><div style="width:80px;height:80px;border-radius:22px;background:var(--grad);display:grid;place-items:center;color:#fff;margin:0 auto 18px;box-shadow:var(--glow);animation:corePulse 1.5s infinite">${ic('scan',36)}</div><p style="color:var(--mut);font-size:13px">Tikrinamas failo tipas, struktūra ir grėsmės...</p></div>`,false);
setTimeout(()=>{

function analyzeFile(file){
const ext=(file.name.split('.').pop()||'').toLowerCase();
const dangerous=['exe','bat','cmd','scr','pif','vbs','js','msi'];
const suspicious=['jar','apk','sh','ps1'];
const checks=[];let score=100;
const isDangerous=dangerous.includes(ext);const isSuspicious=suspicious.includes(ext);
if(isDangerous){checks.push({name:'Failo tipas',status:'danger',msg:'Potencialiai pavojingas plėtinys: .'+ext});score-=40}
else if(isSuspicious){checks.push({name:'Failo tipas',status:'warn',msg:'Reikia papildomos patikros: .'+ext});score-=15}
else checks.push({name:'Failo tipas',status:'ok',msg:'Saugus tipas: .'+ext});
if(file.size>5*1024*1024){checks.push({name:'Failo dydis',status:'warn',msg:'Didelis failas (>5 MB)'});score-=10}
else checks.push({name:'Failo dydis',status:'ok',msg:'Normalus dydis: '+fmtSize(file.size)});
const hash=Math.abs(file.name.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0));
if(hash%7===0&&!isDangerous){checks.push({name:'Struktūros analizė',status:'warn',msg:'Rasta neaiškių sekcijų'});score-=20}
else checks.push({name:'Struktūros analizė',status:'ok',msg:'Struktūra vientisa'});
if(isDangerous){checks.push({name:'Grėsmių aptikimas',status:'danger',msg:'Potenciali grėsmė aptikta'});score-=25}
else checks.push({name:'Grėsmių aptikimas',status:'ok',msg:'Grėsmių nerasta'});
checks.push({name:'Virusų bazė',status:'ok',msg:'Atnaujinta prieš 2 val.'});
score=Math.max(0,Math.min(100,score));
const status=score>=80?'safe':score>=50?'warn':'danger';
return{score,status,checks};
}
function showSecurityResult(c){
const circ=2*Math.PI*70;const offset=circ-(c.score/100)*circ;
const color=c.score>=80?'var(--ok)':c.score>=50?'var(--warn)':'var(--err)';
openModal(`<h3>Saugumo rezultatas</h3><p class="msub">${esc(c.name)} · ${fmtSize(c.size)}</p>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="scGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4d7dfe"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs></svg>

const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=d.toISOString().slice(0,10);const count=files.filter(f=>{const fd=new Date(f.createdAt).toISOString().slice(0,10);return fd===key}).length;days.push({label:d.toLocaleDateString('lt-LT',{weekday:'short'}),count})}
const maxDay=Math.max(1,...days.map(d=>d.count));

const thisWeek=files.filter(f=>Date.now()-f.createdAt<7*86400000).length;
const thisMonth=files.filter(f=>Date.now()-f.createdAt<30*86400000).length;
const shared=files.filter(f=>f.shareToken).length;
const favs=files.filter(f=>f.fav).length;
const totalKinds=Object.values(kinds).reduce((a,b)=>a+b,0)||1;
let acc=0;
const donutSegs=Object.entries(kinds).map(([k,v])=>{const pct=v/totalKinds*100;const seg={k,pct,offset:acc,color:kColors[k]};acc+=pct;return seg});
const circ=2*Math.PI*45;
return`<div class="greet"><div><h2>Analytics <span class="grad-tx">Dashboard</span> 📊</h2><p>Detali jūsų failų ir aktyvumo statistika</p></div></div>
<div class="an-grid">

<div class="stat"><span class="sic" style="background:var(--grad3)">${ic('trending',20)}</span><b>${thisWeek}</b><span>Šią savaitę</span></div>
<div class="stat"><span class="sic" style="background:var(--grad4)">${ic('star',20)}</span><b>${favs}</b><span>Mėgstami</span></div>
</div>
<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px">
<div class="an-chart"><h4>${ic('chart',16)} Aktyvumas per 7 dienas</h4><div class="an-bars">${days.map(d=>`<div class="ab" style="height:${Math.max(4,d.count/maxDay*100)}%"><span>${d.count}</span><small>${d.label}</small></div>`).join('')}</div></div>
<div class="an-chart"><h4>${ic('grid',16)} Failų tipai</h4><div class="an-donut">
<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--panel2)" stroke-width="14"/>
${donutSegs.map(s=>`<circle cx="50" cy="50" r="45" fill="none" stroke="${s.color}" stroke-width="14" stroke-dasharray="${s.pct/100*circ} ${circ}" stroke-dashoffset="${-s.offset/100*circ}" transform="rotate(-90 50 50)"/>`).join('')}
<text x="50" y="50" text-anchor="middle" dy=".3em" fill="var(--txt)" font-family="Unbounded" font-size="14" font-weight="700">${totalKinds}</text>
<text x="50" y="62" text-anchor="middle" fill="var(--mut)" font-size="6" font-weight="700">FAILŲ</text></svg>
<div class="legend">${Object.entries(kinds).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="lg-row"><span class="dot" style="background:${kColors[k]}"></span>${kLabels[k]}<b>${v}</b></div>`).join('')}</div>
</div></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
<div class="an-chart"><h4>${ic('trending',16)} Tendencijos</h4><div class="an-trend">
<div class="tr"><span class="tr-ico" style="background:var(--grad)">${ic('upload',18)}</span><div><b>Įkelta failų</b><small>Per paskutines 30 d.</small></div><span class="tr-val grad-tx">${thisMonth}</span></div>
<div class="tr"><span class="tr-ico" style="background:var(--grad2)">${ic('link',18)}</span><div><b>Bendrinamos nuorodos</b><small>Aktyvios nuorodos</small></div><span class="tr-val grad-tx">${shared}</span></div>
<div class="tr"><span class="tr-ico" style="background:var(--grad3)">${ic('star',18)}</span><div><b>Mėgstami failai</b><small>Pažymėti žvaigždute</small></div><span class="tr-val grad-tx">${favs}</span></div>
<div class="tr"><span class="tr-ico" style="background:var(--grad4)">${ic('chart',18)}</span><div><b>Vidutinis dydis</b><small>Vieno failo</small></div><span class="tr-val grad-tx">${files.length?fmtSize(total/files.length):'0 B'}</span></div>
</div></div>
<div class="an-chart"><h4>${ic('file',16)} Didžiausi failai</h4>
${topFiles.length?topFiles.map(f=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:7px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">${esc(f.name)}</span><span style="color:var(--mut)">${fmtSize(f.size)}</span></div><div class="bar"><i style="width:${Math.max(3,f.size/Math.max(1,topFiles[0].size)*100)}%"></i></div></div>`).join(''):`<p style="color:var(--mut);font-size:13px">Failų dar nėra.</p>`}
</div>
</div>`;
}

const attempts={};
function lockCheck(key){const a=attempts[key];if(a&&a.until>Date.now())return Math.ceil((a.until-Date.now())/1000);return 0}
function failBump(key){const a=attempts[key]||{n:0,until:0};a.n++;if(a.n>=5){a.until=Date.now()+60000;a.n=0;log('security','Anti-Spam: 5 bandymai — 60 sek. blokuotė ('+key+')')}attempts[key]=a}

async function handleFiles(list){const u=me();if(!u)return;let ok=0,bad=0;for(const file of list){if(file.size>MAX10){bad++;toast(`⛔ „${esc(file.name)}" viršija 10 MB`,'error');continue}const fid=uid();const tray=document.createElement('div');tray.className='upitem';tray.innerHTML=`<div class="ut">${ic('upload',15)}<b>${esc(file.name)}</b><span class="ust">0%</span></div><div class="bar"><i></i></div>`;$('#uptray').appendChild(tray);const bar=tray.querySelector('.bar i'),pct=tray.querySelector('.ust');let p=0;await new Promise(res=>{const iv=setInterval(()=>{p=Math.min(100,p+rnd(9,24));bar.style.width=p+'%';pct.textContent=p+'%';if(p>=100){clearInterval(iv);res()}},110)});await FileStore.put(fid,file);db.files.push({id:fid,ownerId:u.id,parentId:state.folder||'root',name:file.name,type:'file',mime:file.type||'application/octet-stream',size:file.size,createdAt:Date.now(),shareToken:null,fav:false,history:[{time:Date.now(),action:'Įkeltas'}]});saveDB();tray.classList.add('done');pct.textContent='✓';setTimeout(()=>tray.remove(),2600);ok++}if(ok){log('file',`Įkelta: ${ok} failų`);toast(`Įkelta: ${ok} ⚡`,'success','upload');render()}}

{rx:/(security|saugum|patikr|scan)/i,a:'🛡️ Security Check analizuoja failus: tikrina tipą, struktūrą, grėsmes ir pateikia saugumo balą 0-100%. Rasta: 🟢 Saugus, 🟡 Reikia patikros, 🔴 Pavojingas.'},
{rx:/(preview|peržiūr|perziur)/i,a:'👁️ Preview modulyje peržiūrėsite paveikslėlius, PDF, tekstą, audio ir video tiesiai naršyklėje — be atsisiuntimo.'},
{rx:/(website|web|svetain|svetain)/i,a:'🌐 Website Preview — kurkite HTML/CSS/JS svetaines su live preview, versijų istorija ir peržiūros nuorodomis.'},
{rx:/(analytics|statistik|grafik)/i,a:'📊 Analytics rodo: failų statistiką, aktyvumo grafikus, tipų pasiskirstymą, tendencijas ir didžiausius failus.'},
{rx:/(notif|pranešim|pranesim)/i,a:'🔔 Notification Center — visi pranešimai vienoje vietoje su filtravimu pagal tipą (naujienos, sistema, failai, sauga).'},
{rx:/(sync|debes|cloud|atsargin)/i,a:'☁️ Cloud Sync — automatinė sinchronizacija, atsarginės kopijos kas 3 dienas, kelių įrenginių palaikymas ir duomenų atkūrimas.'},
{rx:/(slaptažod|slaptazod|password)/i,a:'Slaptažodžiai saugomi SHA-256 🔒 — net administratoriai nemato jūsų slaptažodžio.'},
{rx:/(tema|tams|švies|svies|theme)/i,a:'Temą pakeisite 🌙/☀️ mygtuku viršuje. Pasirinkimas išsaugomas.'},
{rx:/(registr|register|paskyr)/i,a:'Registracijai reikia Gmail adreso, nick ir slaptažodžio. Į paštą atsiųsime 6 skaitmenų kodą.'},
{rx:/(fail|dyd|limit|riba|kiek)/i,a:'📦 Failų kiekis — neribotas. Vieno failo dydis — iki 10 MB. Palaikomi visi formatai.'},
{rx:/(admin|naujien)/i,a:'Sistemos naujienas skelbia administratorius — jos realiu laiku atsiranda Dashboard.'},
{rx:/(atsisiųst|atsisiunst|download)/i,a:'Failą atsisiųsite ⬇️ mygtuku ant failo kortelės arba Preview modulyje.'},
{rx:/(saug|secure|https)/i,a:'Jūsų duomenys saugūs:  HTTPS, SHA-256, Anti-Bot, automatinės atsarginės kopijos ir Cloud Sync.'}
];
function aiSay(text,user){const b=$('#aibody');const d=document.createElement('div');d.className='mcb '+(user?'u':'b');d.textContent=text;b.appendChild(d);b.scrollTop=b.scrollHeight}
function aiReply(q){const b=$('#aibody');const typing=document.createElement('div');typing.className='mcb b tdots';typing.style.width='fit-content';typing.innerHTML='<i></i><i></i><i></i>';b.appendChild(typing);b.scrollTop=b.scrollHeight;setTimeout(()=>{typing.remove();const hit=aiKnow.find(k=>k.rx.test(q));aiSay(hit?hit.a:'Galiu padėti dėl: failų, Coding Zone, Security Check, Preview, Website Preview, Analytics, pranešimų, Cloud Sync. Pabandykite suformuluoti kitaip.')},750)}
function aiInit(){$('#aibtn').innerHTML=ic('bot',26);$('#aiAvatar').innerHTML=ic('bot',20);$('#aiClose').innerHTML=ic('x',15);$('#chatSend').innerHTML=ic('send',17);$('#aichips').innerHTML=['Kaip įkelti failą?','Kas yra Coding Zone?','Kaip veikia Security Check?','Kas yra Cloud Sync?'].map(c=>`<button data-chip="${c}">${c}</button>`).join('');if(!$('#aibody').children.length)aiSay('Sveiki!  Aš IDEA AI. Kuo galiu padėti?')}
$('#aibtn').addEventListener('click',()=>{$('#aipanel').classList.toggle('on');$('#chatInp').focus()});
$('#aiClose').addEventListener('click',()=>$('#aipanel').classList.remove('on'));
$('#aichips').addEventListener('click',e=>{const c=e.target.dataset.chip;if(!c)return;aiSay(c,true);aiReply(c)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#aipanel').classList.remove('on')}});
/* ---------- AFTER RENDER ---------- */
function afterRender(){
if(location.hash.startsWith('#/app/coding'))setTimeout(updateCzPreview,50);
if(location.hash.startsWith('#/app/webpreview'))setTimeout(updateWpPreview,50);
}
/* ---------- GLOBALŪS ---------- */
$('#themeBtn').addEventListener('click',toggleTheme);
$('#burgerBtn').innerHTML=ic('menu',18);
window.addEventListener('scroll',()=>$('#siteNav').classList.toggle('scrolled',window.scrollY>30));
window.addEventListener('hashchange',render);
function updateBellBadge(){const u=me();const b=$('#bellBadge');if(!u||!b)return;const n=db.notifs.filter(x=>x.time>(u.lastNotifSeen||0)&&!x.read).length;b.textContent=n>9?'9+':n}
const ambient=[['Sistema veikia stabiliai','Visos paslaugos online · 99.9% uptime','system'],['Automatinė atsarginė kopija','Duomenys sėkmingai išsaugoti.','system'],['Saugumo patikra baigta','Anti-Bot ir Anti-Spam veikia. ️','security']];
let ambIdx=0;
setInterval(()=>{if(!db||document.visibilityState!=='visible')return;const a=ambient[ambIdx++%ambient.length];notify(a[0],a[1],a[2]);updateBellBadge();if(/^#\/app\/(dash)?$/.test(location.hash))render()},75000);
setInterval(()=>{if(!db||document.visibilityState!=='visible')return;db.lastBackup=Date.now();saveDB();log('system','Automatinė atsarginė kopija sukurta')},120000);
/* ---------- START ---------- */
(async function init(){
applyTheme();
await seed();
aiInit();
render();
setTimeout(()=>$('#boot').classList.add('done'),1000);
setTimeout(()=>$('#boot').remove(),1900);
})();
</script>
</body>
</html>
